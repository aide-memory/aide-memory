name: Release aide-memory

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Opt into Node.js 24 runners for JS actions (default becomes Node 24 in
    # June 2026; Node 20 runners removed September 2026). This env gets us
    # ahead of the deprecation warning seen on v0.3.0 release.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc for test/lib compilation)
        run: npm run build

      - name: Build minified dist (esbuild bundle)
        run: npm run build:dist

      - name: Test
        run: npm test

      - name: Prepare package for npm
        run: cp package.aide-memory.json package.json

      - name: Verify tarball contents (fail if source/maps leak)
        run: ./scripts/verify-package.sh

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
